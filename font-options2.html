<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Thin font options</title>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Jost:wght@300&family=Josefin+Sans:wght@300&family=Montserrat:wght@300&family=DM+Sans:wght@500&display=swap" rel="stylesheet">
<style>body{margin:0;font-family:'DM Sans';color:#2E2420;background:url(sea-bg.jpg) center/cover fixed}
.v{background:rgba(253,250,244,.55);min-height:100vh;padding:30px 16px}
.o{text-align:center;padding:30px 0;border-bottom:1px solid rgba(46,36,32,.12)}
.n{font-size:13px;letter-spacing:3px;text-transform:uppercase;margin-bottom:10px}
.t{font-size:clamp(28px,5.4vw,66px);line-height:1.05;white-space:nowrap;text-transform:uppercase;letter-spacing:.06em}</style></head><body><div class="v">
<div class="o"><div class="n">8 · Tenor Sans (the one you liked)</div><div class="t" style="font-family:'Tenor Sans'">Naturally with Anja</div></div>
<div class="o"><div class="n">8a · Jost Light</div><div class="t" style="font-family:'Jost';font-weight:300">Naturally with Anja</div></div>
<div class="o"><div class="n">8b · Josefin Sans Light</div><div class="t" style="font-family:'Josefin Sans';font-weight:300">Naturally with Anja</div></div>
<div class="o"><div class="n">8c · Montserrat Light</div><div class="t" style="font-family:'Montserrat';font-weight:300">Naturally with Anja</div></div>
</div></body></html>
